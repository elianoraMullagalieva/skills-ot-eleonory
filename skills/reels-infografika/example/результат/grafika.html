<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ИИ-продавец — графика</title>
<style>
@font-face{font-family:M;src:url(../../fonts/Manrope-Light.ttf);font-weight:300}
@font-face{font-family:M;src:url(../../fonts/Manrope-ExtraBold.ttf);font-weight:800}
@font-face{font-family:JB;src:url(../../fonts/JetBrainsMono-Regular.ttf)}
:root{
  /* 3 размера текста — только они */
  --t-hero:150px; --t-mid:64px; --t-cap:40px;
  /* палитра сайта НейроПрактикума */
  --bg:#070707; --ink:#fff; --mut:#8d8d88; --line:rgba(255,255,255,.22); --red:#e73b23; --card:#121212;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden;font-family:M,sans-serif;color:#fff}
#stage{position:relative;width:1080px;height:1040px;overflow:hidden;background:var(--bg);transform-origin:0 0}
.grain{position:absolute;inset:-60px;pointer-events:none;opacity:.2;mix-blend-mode:screen;z-index:60;
  background-image:url("data:image/svg+xml,%3Csvg width='160' height='160' viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");background-size:160px}
.glow{position:absolute;width:1000px;height:1000px;left:40px;top:20px;border-radius:50%;z-index:0;
  background:radial-gradient(circle,rgba(255,255,255,.09),rgba(255,255,255,0) 58%)}
.deco{position:absolute;z-index:40;opacity:0}
.mono{font-family:JB,monospace;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.cross{width:28px;height:28px}
.cross::before,.cross::after{content:"";position:absolute;background:#fff;opacity:.7}
.cross::before{left:13.5px;top:0;width:1px;height:28px}.cross::after{top:13.5px;left:0;height:1px;width:28px}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;z-index:10}
.hero{font-weight:800;font-size:var(--t-hero);letter-spacing:-.065em;line-height:.92;white-space:nowrap}
.mid{font-weight:300;font-size:var(--t-mid);letter-spacing:-.045em;line-height:1;white-space:nowrap}
.cap{font-weight:300;font-size:var(--t-cap);letter-spacing:-.02em;line-height:1.1;color:var(--mut);white-space:nowrap}
.b{font-weight:800}
.red{color:var(--red)}
.w{color:#fff}
.a{position:absolute}
.cx{position:absolute;left:0;right:0;text-align:center}
.tab{font-variant-numeric:tabular-nums}
svg{overflow:visible}
.st{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.st.r{stroke:var(--red)}
.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:28px}
.sk{position:absolute;height:14px;border-radius:7px;background:rgba(255,255,255,.16)}
.dot{position:absolute;border-radius:50%}
.pill{position:absolute;width:64px;height:64px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center}
#hud{position:fixed;left:8px;bottom:8px;font:14px JB,monospace;color:#888;z-index:99}
</style>
</head>
<body>
<div id="stage">
  <div class="glow" id="glow"></div>
  <div class="deco mono" id="dtl" style="left:64px;top:58px">нейро<span style="color:#fff">практикум</span></div>
  <div class="deco mono" id="dtr" style="right:64px;top:58px">ии-продавец</div>
  <div class="deco cross" id="dbl" style="left:50px;bottom:48px"></div>
  <div class="deco cross" id="dbr" style="right:50px;bottom:48px"></div>
  <div class="deco mono tab" id="dnum" style="left:0;right:0;bottom:52px;text-align:center">[ 01 / 27 ]</div>
  <div class="grain" id="grain"></div>
</div>
<div id="hud"></div>
<script>
/* ====== движок: всё — чистая функция от времени t (сек) → точная синхронизация с роликом ====== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const cl=x=>x<0?0:x>1?1:x, L=(a,b,p)=>a+(b-a)*p;
const EZ={expo:t=>t>=1?1:1-Math.pow(2,-10*t),out:t=>1-Math.pow(1-t,3),
  back:t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},io:t=>-(Math.cos(Math.PI*t)-1)/2,lin:t=>t};
const P=(t,a,d=.4,e='expo')=>EZ[e](cl((t-a)/d));
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function T(el,{x=0,y=0,s=1,r=0,o}={}){if(!el)return;el.style.transform=`translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;if(o!==undefined)el.style.opacity=o;}
function IN(el,t,a,{dx=0,dy=36,d=.4,s0=1,e='expo',out=null}={}){
  let p=P(t,a,d,e), o=cl((t-a)/(d*.6));
  if(out!==null){const q=P(t,out,.3,'out');o*=1-q;T(el,{x:dx*(1-p),y:dy*(1-p)-30*q,s:L(s0,1,p),o});return p;}
  T(el,{x:dx*(1-p),y:dy*(1-p),s:L(s0,1,p),o});return p;}
function DRAW(el,p){el.style.strokeDasharray='1 1';el.style.strokeDashoffset=1-p;el.style.opacity=p>0.001?1:0;}
const typed=(s,t,a,per=.045)=>s.slice(0,Math.max(0,Math.floor((t-a)/per)));
const PERSON=(w=70,cls='st')=>`<svg width="${w}" height="${w*80/70}" viewBox="0 0 70 80"><circle class="${cls}" cx="35" cy="24" r="16"/><path class="${cls}" d="M5 78 C5 52 65 52 65 78"/></svg>`;
const ROBOT=(w=120)=>`<svg width="${w}" height="${w}" viewBox="0 0 120 120"><line class="st" x1="60" y1="8" x2="60" y2="28"/><circle cx="60" cy="8" r="6" fill="#fff" class="ant"/><rect class="st" x="14" y="28" width="92" height="76" rx="22"/><circle class="eye" cx="42" cy="64" r="8" fill="#fff"/><circle class="eye" cx="78" cy="64" r="8" fill="#fff"/><line class="st" x1="46" y1="88" x2="74" y2="88"/></svg>`;
const BRAIN=`<path class="st bp" pathLength="1" d="M300 120 C240 60 150 80 140 150 C80 160 60 240 100 280 C70 330 110 400 170 400 C200 450 270 450 300 410 C330 450 400 450 430 400 C490 400 530 330 500 280 C540 240 520 160 460 150 C450 80 360 60 300 120 Z"/>
<path class="st bp" pathLength="1" d="M300 120 L300 410"/><path class="st bp" pathLength="1" d="M180 200 C225 190 235 240 200 262"/><path class="st bp" pathLength="1" d="M420 200 C375 190 365 240 400 262"/><path class="st bp" pathLength="1" d="M160 322 C200 300 240 330 230 362"/><path class="st bp" pathLength="1" d="M440 322 C400 300 360 330 370 362"/>`;

const SC=[];
function S(a,b,html,draw){const el=document.createElement('section');el.className='scene';el.innerHTML=html;
  $('#stage').insertBefore(el,$('#grain'));SC.push({a,b,el,draw,q:s=>$(s,el),qa:s=>$$(s,el)});}

/* ================= СЦЕНЫ (секунды = тайминг речи в ролике) ================= */

// 00a · 0.0 «Шок-контент, друзья!»
S(0.0,1.8,`<svg class="a" style="left:0;top:0" width="1080" height="1040">${Array.from({length:14},(_,i)=>{const a=i*Math.PI/7+.1;return `<path class="st rz${i==3?' r':''}" pathLength="1" style="stroke-width:${i%2?2:4}" d="M${540+250*Math.cos(a)} ${430+250*Math.sin(a)} L${540+470*Math.cos(a)} ${430+470*Math.sin(a)}"/>`}).join('')}</svg>
<div class="cx hero" id="c1" style="top:270px;font-size:150px">шок<span class="red">!</span></div>
<div class="cx mid" id="c2" style="top:440px">контент</div>
<div class="cx cap" id="c3" style="top:560px">друзья</div>`,
(t,q,qa)=>{const p=P(t,0.02,.35,'back');T(q('#c1'),{s:L(1.8,1,p)*(1+.02*Math.sin(t*14)),o:cl(t/.12)});
  qa('.rz').forEach((r,i)=>{DRAW(r,P(t,.08+i*.02,.45,'out'));r.style.opacity=(1-P(t,.9,.6))*(t>.08?1:0);});
  IN(q('#c2'),t,0.55);IN(q('#c3'),t,1.3,{dy:15});});

// 00b · 1.8 «Вчера я навайбкодила себе…»
S(1.8,3.15,`<div class="card" id="tw" style="left:150px;top:140px;width:780px;height:400px;background:#0d0d0d;border-radius:24px">
<div class="a" style="left:28px;top:26px;display:flex;gap:12px">${[0,1,2].map(i=>`<i style="width:16px;height:16px;border-radius:50%;background:${i?'#333':'#e73b23'};display:block"></i>`).join('')}</div>
<div class="a mono" style="right:30px;top:24px">claude code</div>
<div class="a" style="left:0;right:0;top:66px;height:1px;background:var(--line)"></div>
${['› сделай мне продавца','  читаю диалоги…','  пишу скрипт продаж…','  ✓ готово'].map((l,i)=>`<div class="a tl" data-s="${l}" style="left:44px;top:${100+i*64}px;font:28px JB,monospace;color:${i==0?'#fff':i==3?'#e73b23':'#8d8d88'};white-space:pre"></div>`).join('')}</div>
<div class="cx mid" id="c1" style="top:620px">вчера я <span class="b">навайбкодила</span></div>`,
(t,q,qa)=>{IN(q('#tw'),t,1.8,{dy:40,s0:.95});const st=[1.95,2.45,2.7,2.95];
  qa('.tl').forEach((l,i)=>{l.textContent=typed(l.dataset.s,t,st[i],i?.012:.022);});
  IN(q('#c1'),t,2.3);});

// 00c · 3.15 «…себе ИИ-продавца»
S(3.15,5.2,`<div class="a" id="av" style="left:430px;top:110px;width:220px;height:220px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center">${ROBOT(130).replace(/#fff/g,'#070707').replace(/class="st"/g,'class="st rb" style="stroke:#070707"')}</div>
<svg class="a" style="left:410px;top:90px" width="260" height="260" viewBox="0 0 260 260"><circle id="ring" class="st r" pathLength="1" style="stroke-width:6" cx="130" cy="130" r="126"/></svg>
${Array.from({length:18},(_,i)=>`<div class="a mono cg" style="left:0;top:0;color:#fff">${['{','}','<','/>','()','=>',';','[]','ai'][i%9]}</div>`).join('')}
<div class="cx hero" id="c1" style="top:420px;font-size:136px">ИИ-продавец</div>
<div class="cx mono" id="c2" style="top:620px">статус · онлайн <span class="dot" id="od" style="position:relative;display:inline-block;width:14px;height:14px;background:#e73b23;margin-left:10px"></span></div>`,
(t,q,qa)=>{qa('.cg').forEach((c,i)=>{const a=R(i)*Math.PI*2,r=380+R(i+7)*200,p=P(t,3.2+R(i+3)*.25,.55,'io');
    T(c,{x:540+Math.cos(a)*r*(1-p)-12,y:220+Math.sin(a)*r*(1-p)-12,r:(1-p)*200,s:1+(1-p),o:cl((t-3.15)/.2)*(1-P(t,3.7,.15))});});
  IN(q('#av'),t,3.7,{dy:0,s0:.3,e:'back'});DRAW(q('#ring'),P(t,3.85,.6,'out'));
  IN(q('#c1'),t,3.85,{dy:50});IN(q('#c2'),t,4.3,{dy:10});T(q('#od'),{s:1+.35*Math.abs(Math.sin(t*4))});
  T(q('#av'),{s:P(t,3.7,.45,'back')*(1+.02*Math.sin(t*5)),o:cl((t-3.7)/.15)});});

// 00d · 5.2 «который уже к утру»
S(5.2,6.5,`<svg class="a" style="left:0;top:0" width="1080" height="1040"><path id="hz" class="st" pathLength="1" style="stroke-width:2;stroke:var(--line)" d="M140 470 L940 470"/>
<g id="moon"><path d="M-40 -60 A70 70 0 1 0 40 50 A56 56 0 1 1 -40 -60Z" fill="#fff"/></g>
<g id="sun"><circle r="58" fill="#e73b23"/>${Array.from({length:10},(_,i)=>{const a=i*Math.PI/5;return `<line class="st r sr" style="stroke-width:5" x1="${84*Math.cos(a)}" y1="${84*Math.sin(a)}" x2="${112*Math.cos(a)}" y2="${112*Math.sin(a)}"/>`}).join('')}</g></svg>
<div class="cx hero tab" id="clk" style="top:540px">23:00</div>
<div class="cx cap" id="c1" style="top:720px">уже к утру</div>`,
(t,q)=>{DRAW(q('#hz'),P(t,5.2,.4,'out'));const p=P(t,5.25,1.0,'io');
  const mx=L(330,160,p),my=L(250,560,p);q('#moon').setAttribute('transform',`translate(${mx} ${my})`);
  const sx=L(920,720,p),sy=L(580,250,p);q('#sun').setAttribute('transform',`translate(${sx} ${sy}) rotate(${t*60})`);
  const mins=23*60+Math.round(8*60*p);const h=Math.floor(mins/60)%24,m=Math.floor(mins%60/10)*10;
  q('#clk').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');IN(q('#clk'),t,5.2,{dy:30});IN(q('#c1'),t,5.6);});

// 00e · 6.5 «закрыл первую сделку без меня»
S(6.5,8.65,`<div class="card" id="dl" style="left:150px;top:150px;width:780px;height:220px;background:#151515">
<div class="a" style="left:40px;top:50px;width:120px;height:120px;border-radius:30px;background:#e73b23;display:flex;align-items:center;justify-content:center">
<svg width="60" height="60" viewBox="0 0 50 50"><path id="ck" class="st" pathLength="1" style="stroke-width:6" d="M8 26 L20 38 L42 12"/></svg></div>
<div class="a mono" style="left:196px;top:58px">сделка #001</div>
<div class="a mid b" style="left:192px;top:100px">закрыта</div>
<div class="a mono" style="right:40px;top:58px">07:00</div></div>
<div class="cx mid" id="c0" style="top:490px">первая <span class="b">сделка</span></div>
<div class="a" id="me" style="left:480px;top:450px;width:120px;height:120px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center">${PERSON(56)}</div>
<svg class="a" style="left:460px;top:430px" width="160" height="160" viewBox="0 0 160 160"><path id="xs" class="st r" pathLength="1" style="stroke-width:8" d="M20 20 L140 140"/></svg>
<div class="cx hero" id="c1" style="top:620px">без меня</div>`,
(t,q)=>{IN(q('#dl'),t,6.5,{dy:-80,e:'back',d:.5});DRAW(q('#ck'),P(t,6.85,.35,'out'));
  IN(q('#c0'),t,6.9,{out:7.6});IN(q('#me'),t,7.65,{s0:.5,dy:0,e:'back'});DRAW(q('#xs'),P(t,7.9,.3,'out'));
  IN(q('#c1'),t,7.75,{dy:50});});


// 01 · 8.7 «Как это получилось?»
S(8.7,10.25,`<div class="cx mid" id="c1" style="top:235px">как это</div>
<div class="cx hero" id="c2" style="top:320px">получилось</div>
<svg class="a" id="qm" style="left:440px;top:545px" width="200" height="300" viewBox="0 0 200 300">
<path class="st r" pathLength="1" style="stroke-width:16" d="M44 86 C44 22 156 22 156 86 C156 136 100 134 100 190 L100 206"/><circle id="qd" cx="100" cy="262" r="13" fill="#e73b23"/></svg>`,
(t,q)=>{IN(q('#c1'),t,8.72);IN(q('#c2'),t,9.35,{dy:60});DRAW(q('#qm path'),P(t,9.5,.55,'out'));
  q('#qd').style.transform=`scale(${P(t,9.95,.3,'back')})`;q('#qd').style.transformOrigin='100px 262px';
  T(q('#qm'),{r:Math.sin(t*5)*4,o:1});});

// 02 · 10.3 «загрузила свой мозг»
S(10.3,12.2,`<svg class="a" id="br" style="left:240px;top:110px" width="600" height="500" viewBox="0 0 600 500">${BRAIN}</svg>
${Array.from({length:14},(_,i)=>`<div class="dot up" style="width:10px;height:10px;background:${i%5==0?'#e73b23':'#fff'}"></div>`).join('')}
<div class="a" style="left:240px;top:700px;width:600px;height:6px;background:var(--line);border-radius:3px"><div id="bar" style="height:100%;width:0;background:#fff;border-radius:3px"></div></div>
<div class="a mono tab" id="pct" style="left:240px;top:650px">загрузка 0%</div>
<div class="cx mid" id="c1" style="top:790px">загрузила свой <span class="b">мозг</span></div>`,
(t,q,qa)=>{qa('.bp').forEach((p,i)=>DRAW(p,P(t,10.35+i*.12,.8,'out')));
  const p=P(t,10.7,1.35,'io');q('#bar').style.width=p*100+'%';q('#pct').textContent='загрузка '+Math.round(p*100)+'%';
  q('#pct').style.opacity=cl((t-10.5)/.3);
  T(q('#br'),{s:1+.02*Math.sin(t*6),o:1});
  qa('.up').forEach((d,i)=>{const ph=(t*1.1+R(i))%1;const on=t>10.7;
    T(d,{x:300+R(i+9)*480,y:L(690,300,EZ.out(ph)),o:on?Math.sin(Math.PI*ph)*.9:0});});
  IN(q('#c1'),t,10.72);});

// 03 · 12.2 «в два профиля — личный и рабочий»
S(12.2,14.6,`<svg class="a" style="left:0;top:0" width="1080" height="1040"><path id="l1" class="st" pathLength="1" style="stroke-dasharray:1 1;stroke-width:2" d="M540 330 C540 420 300 380 300 470"/><path id="l2" class="st" pathLength="1" style="stroke-width:2" d="M540 330 C540 420 780 380 780 470"/></svg>
<svg class="a" id="br" style="left:420px;top:110px" width="240" height="200" viewBox="0 0 600 500">${BRAIN}</svg>
${[['личный',110],['рабочий',590]].map(([n,x],i)=>`<div class="card cd${i}" style="left:${x}px;top:470px;width:380px;height:400px">
<div class="a" style="left:40px;top:40px;width:110px;height:110px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center">${PERSON(56)}</div>
<div class="a mono" style="right:36px;top:48px">0${i+1}</div>
<div class="a mid b" style="left:40px;top:190px">${n}</div>
<div class="sk" style="left:40px;top:290px;width:260px"></div><div class="sk" style="left:40px;top:322px;width:190px"></div>
<div class="dot" style="left:300px;top:320px;width:22px;height:22px;background:${i?'#e73b23':'#fff'}"></div></div>`).join('')}
<div class="dot pk" style="width:12px;height:12px;background:#e73b23;left:-6px;top:-6px"></div><div class="dot pk" style="width:12px;height:12px;background:#e73b23;left:-6px;top:-6px"></div>`,
(t,q,qa)=>{qa('.bp').forEach(p=>DRAW(p,1));T(q('#br'),{s:L(1.6,1,P(t,12.2,.5)),y:1*Math.sin(t*3)*4,o:1});
  const p1=P(t,12.55,.5,'out'),p2=P(t,13.35,.5,'out');DRAW(q('#l1'),p1);DRAW(q('#l2'),p2);
  IN(q('.cd0'),t,13.05,{dx:-60,dy:0});IN(q('.cd1'),t,13.7,{dx:60,dy:0});
  [q('#l1'),q('#l2')].forEach((l,i)=>{const pk=qa('.pk')[i],ph=(t*.9+i*.5)%1,len=l.getTotalLength(),pt=l.getPointAtLength(len*ph);
    T(pk,{x:pt.x,y:pt.y,o:(i?p2:p1)>=1?Math.sin(Math.PI*ph):0});});});

// 04 · 14.7 «порядка 20 тысяч диалогов»
S(14.7,17.25,`${Array.from({length:30},(_,i)=>{const w=90+R(i)*110;return `<div class="bub a" style="width:${w}px;height:48px;border-radius:24px 24px 24px 6px;border:1px solid ${i==7||i==19?'#e73b23':'rgba(255,255,255,.25)'};background:rgba(255,255,255,.03)"></div>`}).join('')}
<div class="a" style="left:190px;top:280px;width:700px;height:420px;background:radial-gradient(closest-side,#070707 55%,rgba(7,7,7,0))"></div>
<div class="cx cap" id="c0" style="top:300px">порядка</div>
<div class="cx hero tab" id="num" style="top:370px">0</div>
<div class="cx mid" id="c1" style="top:560px">диалогов</div>`,
(t,q,qa)=>{qa('.bub').forEach((b,i)=>{let x=40+R(i+3)*880,y=150+R(i+40)*720;if(y>300&&y<680&&x>170&&x<800)x=x<485?x-230:x+230;
    const a=14.8+R(i+77)*1.6,p=P(t,a,.35,'back');T(b,{x,y:y-(t-14.7)*18,s:p,o:cl((t-a)/.2)*.9});});
  IN(q('#c0'),t,14.85);IN(q('#num'),t,15.2,{s0:.85});
  q('#num').textContent=(Math.round(20000*P(t,15.3,1.2,'expo')/10)*10).toLocaleString('ru-RU');
  IN(q('#c1'),t,16.4);});

// 05 · 17.3 «с живыми людьми, кто проходил у меня»

const qs=new URLSearchParams(location.search);

    if(e.code=='ArrowRight'){tp+=1;t0-=1;} if(e.code=='ArrowLeft'){tp=Math.max(0,tp-1);t0+=1;}});
  (function loop(){const now=performance.now()/1000;if(!paused){tp=(now-t0)%window.DURATION;}

}else{$('#hud').remove();}
